<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">Research contribution workflow</title><desc id="desc">An illustrative flow from 183 survey responses through Python analysis to an AI source-label recall research contribution.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071923"/><stop offset="1" stop-color="#102c35"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#2b9c88" stop-opacity=".25"/><stop offset="1" stop-color="#2b9c88" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9ed6ce" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs><rect width="720" height="470" rx="22" fill="url(#bg)"/><rect width="720" height="470" rx="22" fill="url(#grid)"/><ellipse cx="400" cy="260" rx="400" ry="230" fill="url(#glow)"/>
