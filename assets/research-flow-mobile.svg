<g><rect x="48" y="349" width="624" height="74" rx="15" fill="#102a34" stroke="#4b777a"/><circle cx="76" cy="386" r="5" fill="#79dec4"/><text x="96" y="381" fill="#91b9b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.2">RESEARCH CONTRIBUTION</text><text x="96" y="403" fill="#f4f5e9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">AI source-label recall</text></g><circle cx="360" cy="233" r="4" fill="#f4c27a"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;1;.55" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="360" cy="335" r="4" fill="#f4c27a"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;1;.55" dur="3.2s" repeatCount="indefinite"/></circle>
